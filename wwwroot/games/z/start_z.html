<!DOCTYPE html>
<html lang="tr">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
   <meta name="screen-orientation" content="landscape">
   <meta name="theme-color" content="#87CEEB">
   <meta name="mobile-web-app-capable" content="yes">
   <meta name="apple-mobile-web-app-status-bar-style" content="black">
   <title>Dino Oyunu</title>
   <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
   
   <style>
       * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
       }
       
       body {
           background: #000;
           overflow: hidden;
           font-family: monospace;
           width: 100vw;
           height: 100vh;
           -webkit-user-select: none;
           -moz-user-select: none;
           -ms-user-select: none;
           user-select: none;
           -webkit-touch-callout: none;
           -webkit-tap-highlight-color: transparent;
       }
       
       #game-container {
           width: 100vw;
           height: 100vh;
           display: flex;
           align-items: center;
           justify-content: center;
       }
       
       canvas {
           display: block;
           background: #87CEEB;
       }
       
       ::-webkit-scrollbar {
           display: none;
       }
       
       input, textarea, select {
           font-size: 16px !important;
       }

       /* Landscape orientation controls */
       .rotate-message {
           display: none;
           position: fixed;
           top: 0;
           left: 0;
           width: 100vw;
           height: 100vh;
           background: #000;
           color: #fff;
           text-align: center;
           font-family: monospace;
           z-index: 9999;
           flex-direction: column;
           align-items: center;
           justify-content: center;
       }
       
       .rotate-icon {
           font-size: 48px;
           margin-bottom: 20px;
           animation: rotate 2s linear infinite;
       }
       
       .rotate-text {
           font-size: 24px;
           margin: 10px 0;
       }
       
       .rotate-subtext {
           font-size: 18px;
           opacity: 0.8;
       }
       
       @keyframes rotate {
           from { transform: rotate(0deg); }
           to { transform: rotate(360deg); }
       }
       
       /* rotation message */
       @media screen and (orientation: portrait) {
           .rotate-message {
               display: flex;
           }
           #game-container {
               display: none;
           }
       }
   </style>
</head>
<body>
   <div class="rotate-message">
       <div class="rotate-icon">📱</div>
       <div class="rotate-text">Cihazınızı Çevirin</div>
   </div>
   
   <div id="game-container"></div>
   
   <script src="game_z.js"></script>
   <script>
       
       class ResponsiveManager {
   constructor(scene) {
       this.scene = scene;
       this.currentWidth = scene.sys.game.canvas.width;
       this.currentHeight = scene.sys.game.canvas.height;
       this.baseWidth = 800;
       this.baseHeight = 600;
       this.scaleX = this.currentWidth / this.baseWidth;
       this.scaleY = this.currentHeight / this.baseHeight;
       this.scale = Math.min(this.scaleX, this.scaleY);
       this.isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || this.currentWidth < 768;
       this.isTablet = /iPad|Android/i.test(navigator.userAgent) && this.currentWidth >= 768 && this.currentWidth <= 1024;
       console.log(`Responsive: ${this.currentWidth}x${this.currentHeight}, scale: ${this.scale.toFixed(3)}`);
   }
   
   scaleValue(value) { return value * this.scale; }
   scaleX(value) { return value * this.scale; }
   scaleY(value) { return value * this.scale; }
   
   getFontSize(baseSize) {
       const scaledSize = baseSize * this.scale;
       return Math.max(10, Math.min(100, scaledSize));
   }
   
   getSafeArea() {
       const margin = this.isMobile ? 20 : 10;
       return {
           left: margin,
           right: this.currentWidth - margin,
           top: margin,
           bottom: this.currentHeight - margin
       };
   }
   
   getPlayerPosition() {
       return {
           x: this.scaleValue(120),
           y: this.currentHeight - this.scaleValue(120)
       };
   }
}

     
       class TouchControlManager {
           constructor(scene) {
               this.scene = scene;
               this.responsive = scene.responsive;
               
               if (this.responsive.isMobile) {
                   this.setupTouchAreas();
                   this.createVisualIndicators();
               }
           }
           
           setupTouchAreas() {
               // Jump area ekranın üstten 2/3 ü
               this.jumpArea = this.scene.add.rectangle(
                   this.scene.scale.width / 2,
                   this.scene.scale.height * 0.33,
                   this.scene.scale.width,
                   this.scene.scale.height * 0.66,
                   0x000000,
                   0 // görünmez
               );
               this.jumpArea.setInteractive();
               this.jumpArea.setDepth(1900);
               
               // Duck area ekranın alttan 1/3 ü
               this.duckArea = this.scene.add.rectangle(
                   this.scene.scale.width / 2,
                   this.scene.scale.height * 0.83,
                   this.scene.scale.width,
                   this.scene.scale.height * 0.33,
                   0x000000,
                   0 // görünmez
               );
               this.duckArea.setInteractive();
               this.duckArea.setDepth(1900);
               
               this.setupTouchEvents();
           }
           
           createVisualIndicators() {
               const safeArea = this.responsive.getSafeArea();
               
               // jump instruction
               this.jumpText = this.scene.add.text(
                   this.scene.scale.width / 2,
                   safeArea.bottom - this.responsive.scaleValue(100),
                   'ZIPLAMAK İÇİN DOKUN',
                   {
                       fontSize: this.responsive.getFontSize(18) + 'px',
                       fill: '#ffffff',
                       stroke: '#000000',
                       strokeThickness: this.responsive.scaleValue(3),
                       alpha: 0.9
                   }
               );
               this.jumpText.setOrigin(0.5);
               this.jumpText.setDepth(2000);
               
               // duck instruction
               this.duckText = this.scene.add.text(
                   this.scene.scale.width / 2,
                   safeArea.bottom - this.responsive.scaleValue(60),
                   'EĞİLMEK İÇİN BASILI TUT',
                   {
                       fontSize: this.responsive.getFontSize(14) + 'px',
                       fill: '#ffffff',
                       stroke: '#000000',
                       strokeThickness: this.responsive.scaleValue(2),
                       alpha: 0.9
                   }
               );
               this.duckText.setOrigin(0.5);
               this.duckText.setDepth(2000);
               
               // 3 sn sonra instructionları sakla
               this.scene.time.delayedCall(3000, () => {
                   this.scene.tweens.add({
                       targets: [this.jumpText, this.duckText],
                       alpha: 0,
                       duration: 1000,
                       onComplete: () => {
                           if (this.jumpText) this.jumpText.destroy();
                           if (this.duckText) this.duckText.destroy();
                       }
                   });
               });
           }
           
           setupTouchEvents() {
               // Jump handling
               this.jumpArea.on('pointerdown', () => {
                   if (this.scene.player && this.scene.player.body.blocked.down && !this.scene.player.isDucking) {
                       this.scene.player.setVelocityY(-this.scene.CONFIG.jumpForce);
                       
                       if (!this.scene.isMuted && this.scene.sounds && this.scene.sounds.jump) {
                           this.scene.sounds.jump.play();
                       }
                       
                       // Jump animation
                       this.scene.tweens.add({
                           targets: this.scene.player,
                           rotation: 0.2,
                           duration: 300,
                           ease: 'Power2'
                       });
                   }
               });
               
               // Duck handling
               this.duckArea.on('pointerdown', () => {
                   if (this.scene.player && this.scene.player.body.blocked.down && !this.scene.player.isDucking) {
                       this.scene.startDucking();
                   }
               });
               
               this.duckArea.on('pointerup', () => {
                   if (this.scene.player && this.scene.player.isDucking) {
                       this.scene.stopDucking();
                   }
               });
               
               // Stop ducking when jumping
               this.jumpArea.on('pointerdown', () => {
                   if (this.scene.player && this.scene.player.isDucking) {
                       this.scene.stopDucking();
                   }
               });
           }
           
           destroy() {
               if (this.jumpArea) this.jumpArea.destroy();
               if (this.duckArea) this.duckArea.destroy();
               if (this.jumpText) this.jumpText.destroy();
               if (this.duckText) this.duckText.destroy();
           }
       }

    
       const config = {
           type: Phaser.AUTO,
           width: '100%',
           height: '100%',
           parent: 'game-container',
           backgroundColor: '#87CEEB',
           physics: {
               default: 'arcade',
               arcade: {
                   gravity: { y: 2200 },
                   debug: false
               }
           },
           scale: {
               mode: Phaser.Scale.RESIZE,
               autoCenter: Phaser.Scale.CENTER_BOTH,
               min: {
                   width: 320,
                   height: 240
               },
               max: {
                   width: 1920,
                   height: 1080
               }
           },
           scene: [GameStartScene, GameScene, GameOverScene, VictoryScene],
           render: {
               pixelArt: false,
               antialias: true
           }
       };

       // Prevent mobile gestures
       document.addEventListener('gesturestart', e => e.preventDefault());
       document.addEventListener('gesturechange', e => e.preventDefault());
       document.addEventListener('gestureend', e => e.preventDefault());
       
       document.addEventListener('touchstart', e => {
           if (e.touches.length > 1) {
               e.preventDefault();
           }
       }, { passive: false });

       document.addEventListener('touchmove', e => {
           if (e.touches.length > 1) {
               e.preventDefault();
           }
       }, { passive: false });

       // yatay ekrana kitle
       if (screen.orientation && screen.orientation.lock) {
           screen.orientation.lock('landscape').catch(err => {
               console.log('Orientation lock not supported');
           });
       }

       // for older browsers
       if (screen.lockOrientation) {
           screen.lockOrientation('landscape');
       }

       // Handle app visibility changes on mobile
       document.addEventListener('visibilitychange', () => {
           if (game && game.scene && game.scene.scenes.length > 0) {
               if (document.hidden) {
                   game.scene.scenes.forEach(scene => {
                       if (scene.scene.isActive()) {
                           scene.scene.pause();
                       }
                   });
               } else {
                   game.scene.scenes.forEach(scene => {
                       if (scene.scene.isPaused()) {
                           scene.scene.resume();
                       }
                   });
               }
           }
       });

       // Initialize the game
       const game = new Phaser.Game(config);
       
       // Debug info
       console.log('Device type:', /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop');
       console.log('Viewport size:', window.innerWidth, 'x', window.innerHeight);
       console.log('Device pixel ratio:', window.devicePixelRatio);
   </script>
</body>
</html>
